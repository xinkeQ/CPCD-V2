services:
  - type: web
    name: cpcd-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm run start:server
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: DEEPSEEK_FALLBACK_MODEL
        value: deepseek-chat
